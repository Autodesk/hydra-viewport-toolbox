name: Setup vcpkg Cache
description: Bootstrap vcpkg and configure NuGet-based binary caching
inputs:
  os:
    required: true
  gh-packages-token:
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Bootstrap vcpkg
      shell: bash
      run: ./externals/vcpkg/bootstrap-vcpkg.sh

    - name: Setup NuGet credentials (Windows)
      shell: pwsh
      if: runner.os == 'Windows' && (inputs.gh-packages-token != '' || github.token != '')
      env:
        # The PAT when present, else the read-only github.token the calling
        # job always has. It cannot be routed here through the caller's
        # secrets: mapping - that pass-through arrives empty.
        GH_PACKAGES_TOKEN: ${{ inputs.gh-packages-token || github.token }}
      run: |
        Remove-Item Env:VCPKG_ROOT
        $VCPKG_ROOT = "./externals/vcpkg"
        $NUGET_EXE = & "$VCPKG_ROOT/vcpkg" fetch nuget | Select-Object -Last 1
        $FEED_URL = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

        # Remove existing source if it exists (self-hosted runner persistence)
        & "$NUGET_EXE" sources remove -Name github -ErrorAction SilentlyContinue

        & "$NUGET_EXE" sources add `
          -Source "$FEED_URL" `
          -Name github `
          -UserName "${{ github.repository_owner }}" `
          -Password "$env:GH_PACKAGES_TOKEN" `
          -StorePasswordInClearText

        & "$NUGET_EXE" setapikey "$env:GH_PACKAGES_TOKEN" `
          -Source "$FEED_URL"

    - name: Setup NuGet credentials (Unix)
      shell: bash
      if: runner.os != 'Windows' && (inputs.gh-packages-token != '' || github.token != '')
      env:
        # The PAT when present, else the read-only github.token the calling
        # job always has. It cannot be routed here through the caller's
        # secrets: mapping - that pass-through arrives empty.
        GH_PACKAGES_TOKEN: ${{ inputs.gh-packages-token || github.token }}
      run: |
        VCPKG_ROOT=./externals/vcpkg
        NUGET_EXE=$($VCPKG_ROOT/vcpkg fetch nuget | tail -n 1)
        FEED_URL="https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

        # Remove existing source if it exists (self-hosted runner persistence)
        mono "$NUGET_EXE" sources remove -Name github || true

        mono "$NUGET_EXE" sources add \
          -Source $FEED_URL \
          -Name github \
          -UserName "${{ github.repository_owner }}" \
          -Password "$GH_PACKAGES_TOKEN" \
          -StorePasswordInClearText

        mono "$NUGET_EXE" setapikey "$GH_PACKAGES_TOKEN" \
          -Source $FEED_URL

    - name: Set binary caching env var
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ inputs.gh-packages-token || github.token }}
        GH_PACKAGES_PAT: ${{ inputs.gh-packages-token }}
      run: |
        # No credential at all (neither the PAT nor github.token): build
        # from source without the binary cache instead of failing the
        # pipeline on a missing credential.
        if [ -z "$GH_PACKAGES_TOKEN" ]; then
          echo "::warning::No credential for the vcpkg binary cache; building from source without it."
          echo "VCPKG_BINARY_SOURCES=clear" >> $GITHUB_ENV
          exit 0
        fi
        # Only the real PAT may upload. The github.token fallback (fork PRs,
        # Dependabot, ...) is read-only: restore only. This replaces the old
        # fork-flag check, which would have let a same-repo run without the
        # secret write with a token that cannot.
        MODE=read
        if [ -n "$GH_PACKAGES_PAT" ]; then
          MODE=readwrite
        fi
        echo "VCPKG_BINARY_SOURCES=clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,$MODE" >> $GITHUB_ENV