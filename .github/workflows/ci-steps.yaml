name: Reusable Build Workflow

on:
  workflow_call:
    secrets:
      # Empty for fork PRs (GitHub withholds repo secrets); the
      # setup-vcpkg-cache action falls back to the read-only github.token.
      # required: false because an explicitly-passed empty value would pass
      # the check anyway - the contract is honest about the fork case.
      GH_PACKAGES_TOKEN:
        required: false
    inputs:
      runner:
        required: false
        type: string
        default: linux
      build_type:
        required: false
        type: string
        default: release
      enable_tests:
        required: false
        type: boolean
        default: false
      enable_coverage:
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ${{ inputs.runner == 'linux' && 'ubuntu-24.04' || inputs.runner == 'windows' && 'windows-2022' || inputs.runner == 'mac' && 'macos-15' || inputs.runner == 'gpu' && 'self-hosted' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
      packages: read

    steps:
    - name: Checkout repo
      uses: actions/checkout@v5
      with:
        lfs: true
        submodules: recursive
        fetch-depth: 0
        clean: true  # Clean untracked files if any
        ref: ${{ github.ref }}

    - name: Install dependencies (Linux only)
      if: runner.os == 'Linux'
      run: |
        # Self-heal an interrupted dpkg before apt runs: the self-hosted GPU
        # runner can be deallocated mid-install, which leaves dpkg in a broken
        # state and fails every subsequent run at this step (exit 100).
        # Noninteractive so a pending conffile prompt cannot hang the job.
        sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a --force-confdef --force-confold || true
        # Wait out a concurrent apt/dpkg run (e.g. a Defender auto-update)
        # instead of failing on the lock.
        sudo apt-get update -o DPkg::Lock::Timeout=600 && sudo apt-get install -y -o DPkg::Lock::Timeout=600 libx11-dev libxmu-dev libxi-dev libgl-dev libxrandr-dev libxinerama-dev libxcursor-dev libltdl-dev autoconf autoconf-archive automake libtool mono-complete gcovr python3-venv libglu1-mesa-dev freeglut3-dev

    - name: Install dependencies (MacOS only)
      if: runner.os == 'macOS'
      run: brew install mono

    - name: Setup compiler environment (Windows only)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Setup vcpkg cache
      uses: ./.github/actions/setup-vcpkg-cache
      with:
        os: ${{ runner.os }}
        # Possibly empty (fork PRs); the action applies the github.token
        # fallback and picks the cache mode from which token it got.
        gh-packages-token: ${{ secrets.GH_PACKAGES_TOKEN }}

    - name: Configure
      id: configure
      shell: bash
      run: |
        # The GPU VM is on the internal network, where the public Python package index is blocked:
        # the ports that install Python packages (e.g., libsystemd) must use the internal mirror.
        # The version check would still query the public index.
        if [ "${{ inputs.runner }}" == "gpu" ]; then
          export PIP_INDEX_URL="https://art-toucan.autodesk.com/artifactory/api/pypi/autodesk-pypi-virtual/simple"
          export PIP_DISABLE_PIP_VERSION_CHECK=1
          export VCPKG_KEEP_ENV_VARS="PIP_INDEX_URL;PIP_DISABLE_PIP_VERSION_CHECK"
        fi

        # Build OpenUSD with HgiVulkan on Linux and Windows; the test step selects the backend.
        VULKAN_CACHE_VAR=""
        if [ "${{ inputs.runner }}" == "gpu" ] || [ "${{ inputs.runner }}" == "windows" ] || [ "${{ inputs.runner }}" == "linux" ]; then
          VULKAN_CACHE_VAR="-DHVT_ENABLE_VULKAN=ON"
        fi
        if [ "${{ inputs.enable_coverage }}" == "true" ] && [ "${{ inputs.runner }}" == "gpu" ]; then
          cmake --preset ${{ inputs.build_type }} \
            ${VULKAN_CACHE_VAR} \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_C_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
        else
          cmake --preset ${{ inputs.build_type }} ${VULKAN_CACHE_VAR}
        fi

    - name: Build
      id: build
      run: cmake --build --preset ${{ inputs.build_type }}

    - name: Test (GPU-enabled)
      id: test
      if: inputs.enable_tests && inputs.runner == 'gpu'
      run: |
        # Setup X11 display directly in test step
        if ! pgrep -f "X :99" > /dev/null; then
          sudo X :99 -config /etc/X11/xorg.conf > /dev/null 2>&1 &
          sleep 5
        fi
        export DISPLAY=:99

        # Verify GPU setup
        echo "GPU Info:"
        nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
        echo "OpenGL Renderer:"
        glxinfo | grep -E "(OpenGL version|OpenGL renderer)"

        # Run the tests on the Vulkan backend (the configure step enables it on GPU runners).
        export HVT_TEST_HGI=Vulkan
        ctest --preset ${{ inputs.build_type }} --output-on-failure

    - name: Coverage
      if: inputs.enable_coverage
      uses: ./.github/actions/coverage-report

    - name: Upload test failure outputs
      if: failure() && steps.test.outcome == 'failure'
      uses: actions/upload-artifact@v5
      with:
        name: test-outputs
        path: build/${{ inputs.build_type }}/computed

    - name: Upload vcpkg failure logs
      if: failure() && (steps.configure.outcome == 'failure' || steps.build.outcome == 'failure')
      uses: actions/upload-artifact@v5
      with:
        name: vcpkg-build-logs
        # Only the logs: the source trees can hold file names that artifacts reject (e.g., colons).
        path: |
          externals/vcpkg/buildtrees/**/*.log
          externals/vcpkg/buildtrees/**/*.err
