name: CI Minimal

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build on'
        required: false
        default: 'linux'
        type: choice
        options: [linux, windows, mac]
      build_type:
        description: 'CMake build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, relwithdebinfo, ubsan, asan]

jobs:
  minimal-build:
    # Quick hosted-runner build for every PR; the only CI fork PRs can get
    # (secrets are withheld from forks, so the GPU workflow cannot run there).
    name: ${{ github.event.inputs.platform || 'linux' }}-${{ github.event.inputs.build_type || 'debug' }}
    uses: ./.github/workflows/ci-steps.yaml
    with:
      runner: ${{ github.event.inputs.platform || 'linux' }}
      build_type: ${{ github.event.inputs.build_type || 'debug' }}
    secrets:
      # Forks get no secrets (empty value is fine): the setup-vcpkg-cache
      # action falls back to the read-only github.token it is granted
      # automatically. github.token cannot be passed through this secrets:
      # mapping - it arrives empty in the called workflow.
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
