name: CI Tests & Coverage (Linux Deb)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, relwithdebinfo, ubsan, asan]
      enable_coverage:
        description: 'Enable code coverage'
        required: false
        default: false
        type: boolean

# One run per ref at a time on the single self-hosted GPU VM: a new push
# to the same PR cancels the superseded run instead of piling onto it.
concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  start-vm:
    name: Start GPU VM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM
        run: |
          az vm start --resource-group agp-rg-image-service --name AGP-U24T4-GPU-VM

  tests:
    needs: start-vm
    uses: ./.github/workflows/ci-steps.yaml
    with:
      runner: gpu
      build_type: ${{ github.event.inputs.build_type || 'debug' }}
      enable_tests: true
      enable_coverage: ${{ github.event.inputs.enable_coverage == 'true' || github.event_name != 'workflow_dispatch' }}

    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  stop-vm:
    name: Deallocate GPU VM
    needs: [start-vm, tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for apt/dpkg to finish on the VM
        run: |
          # Deallocating the VM mid apt/dpkg run (e.g. a Defender auto-update)
          # leaves dpkg interrupted and fails every later run at the
          # "Install dependencies" step. Best effort: if the VM is not
          # reachable, just proceed to deallocate.
          az vm run-command invoke \
            --resource-group agp-rg-image-service \
            --name AGP-U24T4-GPU-VM \
            --command-id RunShellScript \
            --scripts "for i in \$(seq 1 60); do fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1 || exit 0; sleep 10; done" \
            || echo "VM unreachable; proceeding to deallocate"

      - name: Deallocate VM
        run: |
          az vm deallocate --resource-group agp-rg-image-service --name AGP-U24T4-GPU-VM
