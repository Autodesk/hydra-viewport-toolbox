name: CI Tests & Coverage (Linux Deb)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, relwithdebinfo, ubsan, asan]
      enable_coverage:
        description: 'Enable code coverage'
        required: false
        default: false
        type: boolean

# One run per ref at a time on the single self-hosted GPU VM: a new push
# to the same PR cancels the superseded run instead of piling onto it.
# Pushes to main queue rather than cancel, keeping per-commit coverage.
concurrency:
  group: ci-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  start-vm:
    name: Start GPU VM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM
        run: |
          az vm start --resource-group agp-rg-image-service --name AGP-U24T4-GPU-VM

  # GPU unit tests use the debug (or chosen) preset with HVT_ENABLE_VULKAN=ON — Vulkan is the
  # default test backend on Linux, matching Windows CI.
  tests:
    needs: start-vm
    uses: ./.github/workflows/ci-steps.yaml
    with:
      runner: gpu
      build_type: ${{ github.event.inputs.build_type || 'debug' }}
      enable_tests: true
      enable_coverage: ${{ github.event.inputs.enable_coverage == 'true' || github.event_name != 'workflow_dispatch' }}

    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  stop-vm:
    name: Deallocate GPU VM
    needs: [start-vm, tests]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deallocate VM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Deallocate only when no other run of this workflow is active or
          # queued: another run may be using (or about to use) the same VM,
          # and its own stop-vm deallocates when done. If this check cannot
          # run, skip: the in-guest idle watchdog is the safety net.
          active=$(gh run list --workflow ci-test.yaml --status in_progress \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" 2>/dev/null)
          queued=$(gh run list --workflow ci-test.yaml --status queued \
            --json databaseId \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }})] | length" 2>/dev/null)
          if [ -z "$active" ] || [ -z "$queued" ] || [ "$active" -gt 0 ] || [ "$queued" -gt 0 ]; then
            echo "Other CI Tests & Coverage runs active or queued; skipping deallocate."
            exit 0
          fi
          az vm deallocate --resource-group agp-rg-image-service --name AGP-U24T4-GPU-VM
